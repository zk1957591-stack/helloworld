```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      background:
        linear-gradient(135deg, #6c5ce7, #00cec9, #fd79a8);
    }

    .card {
      width: 100%;
      max-width: 500px;
      padding: 45px 35px;
      text-align: center;

      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;

      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.20);
    }

    .icon {
      width: 75px;
      height: 75px;
      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: linear-gradient(135deg, #ff7675, #fdcb6e);

      font-size: 34px;
    }

    h1 {
      font-size: 32px;
      color: #2d3436;
      margin-bottom: 12px;
    }

    p {
      color: #636e72;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 13px 28px;

      border-radius: 30px;
      text-decoration: none;

      color: white;
      font-weight: bold;

      background: linear-gradient(135deg, #0984e3, #6c5ce7);

      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.35);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .info {
      margin-top: 25px;
      padding: 12px;

      border-radius: 10px;
      background: #f1f2f6;

      color: #636e72;
      font-size: 13px;
    }

    footer {
      margin-top: 22px;
      font-size: 12px;
      color: #b2bec3;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">🌈</div>

    <h1>Hello, World!</h1>

    <p>
      Welcome to this simple colorful test page.
      Use this page to test your traffic analyzer,
      visitor tracking, and page-view functionality.
    </p>

    <a href="#" class="button">
      Test Page
    </a>

    <div class="info">
      ✓ Page loaded successfully
    </div>

    <footer>
      Simple Traffic Analyzer Test Page
    </footer>

  </div>

</body>
</html>
```
